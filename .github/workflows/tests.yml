# .github/workflows/tests.yml

# The name shown in GitHub's Actions tab
name: Run Tests

# WHEN this workflow runs — on every push and every pull request
# targeting the main branch. This means you get feedback before
# broken code even gets merged, not just after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # GitHub provides a fresh virtual machine for each run —
    # nothing persists between runs, so everything is set up from scratch
    runs-on: ubuntu-latest

    # This spins up a real, temporary Postgres container alongside your
    # test run — similar in spirit to your "db" service in docker-compose.yml,
    # but scoped just to this CI run and thrown away afterward
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger_user
          POSTGRES_PASSWORD: ledger_pass
          POSTGRES_DB: ledger_test_db
        ports:
          - 5432:5432
        # Waits until Postgres is actually ready to accept connections
        # before moving to the next step — same idea as the healthcheck
        # you already have in docker-compose.yml
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Downloads your repo's code onto this virtual machine
      - name: Check out code
        uses: actions/checkout@v4

      # Installs Python on the runner — matches your local version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installs your backend's dependencies (Flask, pytest, etc.)
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      # Applies your Flask-Migrate migrations to the fresh test database,
      # so the "users" and "tasks" tables actually exist before tests run —
      # this replicates the exact steps you ran manually earlier
      - name: Run database migrations
        working-directory: ./backend
        env:
          FLASK_APP: app.py
          DATABASE_URL: postgresql://ledger_user:ledger_pass@localhost:5432/ledger_test_db
        run: flask db upgrade

      # Finally, run the actual test suite
      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ledger_user:ledger_pass@localhost:5432/ledger_test_db
        run: pytest -v
name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger_user
          POSTGRES_PASSWORD: ledger_pass
          POSTGRES_DB: ledger_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Run database migrations
        working-directory: ./backend
        env:
          FLASK_APP: app.py
          DATABASE_URL: postgresql://ledger_user:ledger_pass@localhost:5432/ledger_test_db
        run: flask db upgrade
      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ledger_user:ledger_pass@localhost:5432/ledger_test_db
        run: pytest -v --timeout=30

  # ---------- NEW JOB: only runs if "test" succeeds ----------
  build-and-push:
    runs-on: ubuntu-latest
    needs: test          # <- this job waits for "test" to pass first
    if: github.ref == 'refs/heads/main'   # <- only push images from main, not every PR
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Enables advanced Docker build features (used by the build-push-action below)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logs into Docker Hub using the secrets you just created —
      # note the secret is never printed, GitHub automatically masks it in logs
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Builds the backend image and pushes it with TWO tags:
      # one fixed as "latest" and one unique per commit (short SHA).
      # The commit-specific tag matters a lot — see explanation below.
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }}